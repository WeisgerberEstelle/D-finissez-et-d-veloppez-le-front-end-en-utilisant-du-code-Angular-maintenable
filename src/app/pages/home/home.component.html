<h2>Olympic games app</h2>
<hr />
<div>
  <app-header [title]="titlePage" [stats]="stats"></app-header>
  
  @if (isLoading) {
    <div class="center">
      <app-spinner></app-spinner>
    </div>
  } @else if (error) {
    <div class="error-block">
      <p>{{ error }}</p>
      <button (click)="reloadPage()">
        Reload Page
      </button>
    </div>
  } @else {
    <figure>
      <app-chart 
        type="pie"
        [labels]="chartLabels"
        [data]="chartData"
        label="Medals"
        (chartClick)="onCountryClick($event)">
      </app-chart>
      <figcaption class="center">Medal distribution by country at the Olympic Games</figcaption>
    </figure>
  }
</div>
