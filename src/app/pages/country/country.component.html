<div>
  @if (titlePage) {
    <div>
      <app-header [title]="titlePage" [stats]="stats"/>
    </div>
  }

  @if (isLoading) {
    <div class="flex-center-m">
      <app-spinner></app-spinner>
    </div>
  } @else if (error) {
    <div class="error-block">
      <p>{{ error }}</p>
      <a routerLink="" class="btn-back">Back to Home</a>
    </div>
  } @else if (chartData.length === 0) {
    <div class="flex-center-column-m">
      <p>No data available</p>
      <a routerLink="" class="btn-back">Back to Home</a>
    </div>
  } @else {
    <div class="chart-wrapper">
      <figure class="chart-container">
        <app-chart 
          type="line"
          [chartData]="chartData"
          label="Number of medals">
        </app-chart>
        <figcaption class="flex-center-m">Number of medals won at the Olympic Games per year.</figcaption>
      </figure>
    </div>
    
    <div class="flex-center-m">
      <a routerLink="" class="btn-back">Back to Home</a>
    </div>
  }
</div>
