<main class="country-container">
  @if (titlePage) {
    <div>
      <app-header [title]="titlePage" [stats]="stats"></app-header>
    </div>
  }
  
  @if (pageState !== 'success') {
    <app-page-state
      [state]="pageState"
      [errorMessage]="error"
      [emptyMessage]="'No data available'"
      [showBackButton]="true"
      [backRoute]="''"
    />
  } @else {
    <div class="chart-wrapper">
      <figure class="chart-line-container">
        <app-chart 
          [type]="chartType"
          [chartData]="chartData"
          [label]="chartLabel"
          [xAxisLabel]="xAxisLabel"
          aria-describedby="chart-desc"
        ></app-chart>
        
        <figcaption id="chart-desc" class="flex-center-m">
          Number of medals won at the Olympic Games per year.
        </figcaption>
      </figure>
    </div>
    
    <div class="flex-center-m">
      <a 
        routerLink="" 
        class="btn-back"
        aria-label="Return to home page"
      >
        Back to Home
      </a>
    </div>
  }
</main>
