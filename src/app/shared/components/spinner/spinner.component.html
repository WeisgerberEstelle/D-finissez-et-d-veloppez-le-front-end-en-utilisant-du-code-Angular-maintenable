<div class="spinner-container" [class.center]="center">
    <div
        class="spinner"
        [style.width.px]="size"
        [style.height.px]="size"
        [style.borderWidth.px]="stroke"
        [style.borderTopColor]="color"
    ></div>

    <p class="spinner-label">
        loading...
    </p>
</div>
